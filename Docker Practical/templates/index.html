<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Tic Tac Toe</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            text-align: center;
            margin-top: 50px;
        }

        h1 {
            color: #333;
        }

        .game-board {
            width: 300px;
            margin: 30px auto;

            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
        }

        .cell {
            width: 100px;
            height: 100px;

            font-size: 40px;
            font-weight: bold;

            background-color: white;
            border: 2px solid #333;

            cursor: pointer;
        }

        .cell:hover {
            background-color: #eeeeee;
        }

        .message {
            font-size: 20px;
            margin: 20px;
        }

        .reset {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }

    </style>

</head>

<body>

    <h1>Tic-Tac-Toe</h1>


    {% if winner == "Draw" %}

        <div class="message">
            <strong>It's a Draw!</strong>
        </div>

    {% elif winner %}

        <div class="message">
            <strong>Player {{ winner }} Wins!</strong>
        </div>

    {% else %}

        <div class="message">
            Current Player:
            <strong>{{ current_player }}</strong>
        </div>

    {% endif %}


    <form method="POST">

        <div class="game-board">

            {% for i in range(9) %}

                <button
                    type="submit"
                    name="position"
                    value="{{ i }}"
                    class="cell"
                    {% if board[i] or winner %}disabled{% endif %}
                >

                    {{ board[i] }}

                </button>

            {% endfor %}

        </div>

    </form>


    <form method="POST">

        <button
            type="submit"
            name="reset"
            class="reset">

            New Game

        </button>

    </form>

</body>

</html>
